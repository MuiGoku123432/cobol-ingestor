services:
  neo4j:
    image: neo4j:5-community
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/changeme
      NEO4J_PLUGINS: '["apoc"]'
    volumes:
      - neo4j_data:/data

  cobol-graph-api:
    build: .
    ports:
      - "8080:8080"
    env_file: .env
    depends_on:
      - neo4j

volumes:
  neo4j_data:
