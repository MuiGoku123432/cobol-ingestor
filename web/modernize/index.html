<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>COBOL Modernization Chat</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.1/marked.min.js"></script>
  <style>
    .message-content pre { margin: 0.5rem 0; border-radius: 0.5rem; overflow-x: auto; }
    .message-content code { font-size: 0.875rem; }
    .message-content p { margin: 0.25rem 0; }
    .message-content ul, .message-content ol { margin: 0.25rem 0; padding-left: 1.5rem; }
    .message-content h1, .message-content h2, .message-content h3 { margin-top: 0.75rem; margin-bottom: 0.25rem; font-weight: 600; }
    .message-content h1 { font-size: 1.25rem; }
    .message-content h2 { font-size: 1.125rem; }
    .message-content h3 { font-size: 1rem; }
    .tool-indicator { transition: all 0.3s ease; }
    @keyframes pulse-dot { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
    .pulse-dot { animation: pulse-dot 1.5s ease-in-out infinite; }
  </style>
</head>
<body class="h-full bg-gray-950 text-gray-100 flex">

  <!-- Sidebar -->
  <aside class="w-72 bg-gray-900 border-r border-gray-800 flex flex-col p-4 shrink-0">
    <h1 class="text-lg font-bold text-white mb-6 flex items-center gap-2">
      <svg class="w-6 h-6 text-indigo-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 9l3 3-3 3m5 0h3M5 20h14a2 2 0 002-2V6a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/>
      </svg>
      COBOL Modernizer
    </h1>

    <div class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-gray-400 mb-1">Target Language</label>
        <select id="targetLanguage" class="w-full bg-gray-800 border border-gray-700 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-indigo-500 focus:border-transparent">
          <option value="Java">Java</option>
          <option value="C#">C#</option>
          <option value="Python">Python</option>
          <option value="Go">Go</option>
          <option value="TypeScript">TypeScript</option>
          <option value="Kotlin">Kotlin</option>
        </select>
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-400 mb-1">Framework</label>
        <select id="framework" class="w-full bg-gray-800 border border-gray-700 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-indigo-500 focus:border-transparent">
        </select>
      </div>
    </div>

    <div class="mt-auto pt-4 border-t border-gray-800">
      <button onclick="clearChat()" class="w-full bg-gray-800 hover:bg-gray-700 text-gray-300 text-sm py-2 px-3 rounded-lg transition-colors">
        Clear Chat
      </button>
    </div>
  </aside>

  <!-- Main Chat Area -->
  <main class="flex-1 flex flex-col min-w-0">
    <!-- Messages -->
    <div id="chatMessages" class="flex-1 overflow-y-auto p-6 space-y-4">
      <div class="text-center text-gray-500 mt-20">
        <p class="text-lg">Ask about your COBOL programs</p>
        <p class="text-sm mt-1">I'll use the graph database to understand and translate them</p>
      </div>
    </div>

    <!-- Input -->
    <div class="border-t border-gray-800 p-4">
      <form id="chatForm" onsubmit="sendMessage(event)" class="flex gap-3 max-w-4xl mx-auto">
        <input
          id="chatInput"
          type="text"
          placeholder="Ask about a COBOL program..."
          class="flex-1 bg-gray-800 border border-gray-700 rounded-xl px-4 py-3 text-sm focus:ring-2 focus:ring-indigo-500 focus:border-transparent placeholder-gray-500"
          autocomplete="off"
        >
        <button
          type="submit"
          id="sendBtn"
          class="bg-indigo-600 hover:bg-indigo-500 text-white px-5 py-3 rounded-xl text-sm font-medium transition-colors disabled:opacity-50 disabled:cursor-not-allowed"
        >
          Send
        </button>
      </form>
    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
